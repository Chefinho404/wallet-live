services:
  db:
    image: postgres:17-alpine
    container_name: wallet-live-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "5432:5432"
    volumes:
      - wallet-live-dados:/var/lib/postgresql/data

volumes:
  wallet-live-dados:
